{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <h2>Editar Perfil</h2>
    
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-auth">Salvar Alterações</button>
    </form>
    
    <div class="auth-help-text" style="margin-top: 15px;">
        <a href="{% url 'user_profile' user.username %}">Cancelar e Voltar</a>
    </div>
</div>
{% endblock %}
