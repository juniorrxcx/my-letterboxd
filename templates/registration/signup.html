{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <h2>Criar uma Conta</h2>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-auth">Cadastrar</button>
    </form>
    
    <div class="auth-help-text">
        Já possui conta? <a href="{% url 'login' %}">Faça login aqui</a>.
    </div>
</div>
{% endblock %}
