{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <h2>Entrar no My Letterboxd</h2>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-auth">Entrar</button>
    </form>
    
    <div class="auth-help-text">
        Não tem uma conta? <a href="{% url 'signup' %}">Cadastre-se aqui</a>.
    </div>
</div>
{% endblock %}
