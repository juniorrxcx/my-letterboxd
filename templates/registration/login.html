<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Letterboxd Clone</title>
</head>
<body>
    <h2>Entrar na sua conta</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
    </form>
    <p>Não tem uma conta? <a href="{% url 'signup' %}">Cadastre-se</a></p>
</body>
</html>
